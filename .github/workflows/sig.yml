name: sig

on: [push, pull_request]

jobs:
  sig:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITH: sig
    steps:
    - uses: actions/checkout@v7
    - name: Set up Ruby
      uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
      with:
        ruby-version: ruby
        bundler-cache: true
    - name: Run RBS test
      run: bundle exec rake rbs:test
